_echelle: 'CHOIX Sam du 2026-09-05 : PROPORTIONNEL partout (echelle = course_Roby / course_leader,
  donc toute la course de Roby est atteignable et l''axe 5 ne clampe plus), SAUF l''axe 1
  laisse en 1:1 — c''est le seul ou le proportionnel amplifierait fortement le geste (x1,52)
  et donc les tremblements. Prix assume sur l''axe 1 : ~124 deg de Roby inatteignables a la
  main.'
_zero: 'zero      = position du LEADER prise comme reference (a relever au montage). zero_urdf
  = angle de ROBY correspondant a cette position. Il n''est PAS toujours nul : les butees
  de Roby sont asymetriques sur l''epaule (-1,6..+2,1, centre +0,25) et le coude (-3,0..+0,65,
  centre -1,175). Caler le zero du leader sur le CENTRE de la course de Roby est ce qui rend
  la course pleine effectivement atteignable ; viser le zero URDF ferait deborder d''un cote
  et n''atteindrait jamais l''autre. La pince fait exception : son zero est la position FERMEE,
  donc a une extremite -> ecart_min/ecart_max explicites au lieu de +/- demi-course.'
_zero_calcule: 'zero = MILIEU de la course mecanique mesuree du leader (calcule depuis ~/roby_leader_calib.yaml,
  US-017), sauf : la pince dont le zero est la position FERMEE, et l''axe 4 continu dont le
  zero doit etre releve (aucune butee pour l''ancrer). Ce choix centre le leader et Roby l''un
  sur l''autre, ce qui rend la course pleine effectivement atteignable. Il reste UNE inconnue
  par axe : le SIGNE, qui ne se deduit d''aucune mesure et demande d''observer les deux bras.'
_calibre: 'Tous les parametres sont determines (2026-09-05). Zeros calcules depuis les butees
  mesurees en US-017, sauf l''axe 4 (continu -> pose de reference relevee) et la pince (zero
  = fermee). Signes etablis en croisant les gestes observes avec la convention de Roby : documentee
  pour l''epaule et le coude (trajectoire de sortie du nid), calculee par cinematique directe
  pour les axes 4 et 5. RESTE A VERIFIER SUR LE ROBOT avant tout pilotage.'
_recentrage: 'Zeros mis a jour apres ecriture des Homing_Offset (2026-09-05) : ID1=-1796,
  ID2=-1164, ID5=+1834. Le bouclage a disparu sur ces axes ; le deroulement reste en place,
  il est simplement devenu sans effet pour eux.'
_zeros: 'Zeros : releves sur la pose choisie par l''operateur. Le 2026-09-05, seul l''axe
  5 devait etre corrige — les autres ont ete restaures a leurs valeurs anterieures apres une
  prise globale faite par erreur. La course de reference de joint_1 reste volontairement reduite
  de moitie.'
_signes: 'TOUS les signes inverses le 2026-09-05 apres essai en teleoperation simulee : les
  6 axes partaient a l''envers. Ce n''etait donc pas une erreur par axe mais une convention
  de sens globalement inversee — mes deductions reposaient toutes sur la meme lecture de la
  trajectoire de sortie du nid et sur la cinematique directe. L''essai en simulation prime
  sur la deduction. Sauvegarde : leader_calibration.yaml.avant_inversion_globale'
_note_course_axe1: 'La course de reference de joint_1 est VOLONTAIREMENT reduite de moitie
  (demande de Sam, 2026-09-05) : la vitesse maximale est atteinte avec un geste deux fois
  plus petit. Ce n''est PAS une butee mecanique. ATTENTION : tout recalcul global des ecarts
  depuis les butees mesurees ECRASE ce reglage — il faut le reappliquer ensuite.'
