_doc: 'Correspondance bras guide -> Roby (US-019).

  Formule : ecart = deroulement_[-pi,pi](q_leader - zero) ; q_roby = signe * echelle * ecart
  ; puis CLAMP a [urdf_min, urdf_max].

  Angles en RADIANS. Les valeurs produites sont des angles URDF : le couplage mecanique des
  axes 2/3 est l''affaire du driver ros2_control, jamais d''ici.

  signe / zero / echelle sont a RELEVER AU MONTAGE : tant que ''calibre'' est false, les valeurs
  ci-dessous sont neutres et NE DOIVENT PAS etre utilisees pour piloter.'
_mesures: course_leader et continu proviennent de US-017 (~/roby_leader_calib.yaml), mesures
  faites SERVOS SEULS. A confirmer une fois montes sur le bras.
