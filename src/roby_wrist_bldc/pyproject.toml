# Memes regles que le projet (brasRobot/pyproject.toml) : black + ruff + mypy.
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
